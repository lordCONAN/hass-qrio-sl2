name: Release

# Publish a GitHub Release whenever a version tag is pushed, so HACS/Marketplace
# shows a proper version (e.g. 0.1.7) instead of a commit hash.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
